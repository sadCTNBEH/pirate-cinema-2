[project]
name = "pirate-cinema"
version = "0.5.0"
description = "Pirate Cinema desktop application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles==25.1.0",
    "anyio==4.15.1",
    "beautifulsoup4==4.15.0",
    "fastapi==0.142.2",
    "httpx[socks]==0.28.1",
    "pillow==12.3.0",
    "pychromecast==14.1.0",
    "pydantic==2.13.5",
    "pystray==0.19.5",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
    "pywebview==6.2.1",
    "qrcode==8.2",
    "requests==2.34.2",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "psutil>=5.9.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.15.1",
    "ruff==0.16.1",
]
build = [
    "pyinstaller==6.19.0",
    "pyinstaller-hooks-contrib==2026.9",
]
linux-build = [
    {include-group = "build"},
    "PyQt6==6.12.0",
    "PyQt6-Qt6==6.12.0",
    "PyQt6-WebEngine==6.140.0",
    "PyQt6-WebEngine-Qt6==6.140.0",
    "PyQt6-sip==13.13.0",
    "QtPy==2.4.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
]
ignore = [
    "E402",
    "E701",
    "E702",
    "E741",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["prop-decorator"]

[[tool.mypy.overrides]]
module = [
    "backend.models.*",
    "backend.core.*",
    "backend.exceptions.*",
    "backend.repositories.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
