name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Portable (Windows)
      run: |
        pyinstaller --name pirate-cinema-portable --onefile --windowed --icon build/icon.ico --add-data "static;static" run.py

    - name: Build Installer Dir (Windows)
      run: |
        pyinstaller --name pirate-cinema --onedir --windowed --icon build/icon.ico --add-data "static;static" run.py

    - name: Compile NSIS Installer
      run: |
        choco install nsis
        & 'C:\Program Files (x86)\NSIS\makensis.exe' build/installer.nsi

    - name: Upload Windows Portable
      uses: actions/upload-artifact@v4
      with:
        name: pirate-cinema-portable.exe
        path: dist/pirate-cinema-portable.exe

    - name: Upload Windows Installer
      uses: actions/upload-artifact@v4
      with:
        name: pirate-cinema-installer.exe
        path: pirate-cinema-installer.exe

  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libcairo2-dev libgirepository1.0-dev libgirepository-2.0-dev pkg-config
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install PyGObject pyinstaller

    - name: Build Portable (Linux)
      run: |
        pyinstaller --name pirate-cinema-portable-linux --onefile --add-data "static:static" run.py

    - name: Build Tar (Linux)
      run: |
        pyinstaller --name pirate-cinema-linux --onedir --add-data "static:static" run.py
        cd dist
        tar -czvf pirate-cinema-linux.tar.gz pirate-cinema-linux

    - name: Upload Linux Portable
      uses: actions/upload-artifact@v4
      with:
        name: pirate-cinema-portable-linux
        path: dist/pirate-cinema-portable-linux

    - name: Upload Linux Tar
      uses: actions/upload-artifact@v4
      with:
        name: pirate-cinema-linux.tar.gz
        path: dist/pirate-cinema-linux.tar.gz

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: release_assets/
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: release_assets/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
