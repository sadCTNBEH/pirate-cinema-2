name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality-gate-backend:
    name: Quality Gate Backend (Lint, Types, Tests)
    runs-on: ubuntu-latest
    outputs:
      licenses_complete: ${{ steps.distribution-license-files.outputs.complete }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies and quality tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Ruff Lint Check
      run: |
        python -m ruff check .

    - name: Mypy Strict Typing Check
      run: |
        python -m mypy backend/models backend/core backend/exceptions backend/repositories

    - name: Run Backend Pytest Suite
      run: |
        python -m pytest tests/ -q

    - name: Check public distribution license files
      id: distribution-license-files
      run: python scripts/check_distribution_licenses.py

  quality-gate-frontend:
    name: Quality Gate Frontend (Lint, Types, Tests, Build)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install frontend dependencies
      working-directory: frontend
      run: |
        npm ci

    - name: Check TypeScript Types (tsc --noEmit)
      working-directory: frontend
      run: |
        npm run lint:types

    - name: Run ESLint
      working-directory: frontend
      run: |
        npm run lint:eslint

    - name: Run Node Tests
      working-directory: frontend
      run: |
        npm test

    - name: Build Frontend
      working-directory: frontend
      run: |
        npm run build

  build-windows:
    name: Build on Windows
    needs: [quality-gate-backend, quality-gate-frontend]
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller==6.19.0

    - name: Test Windows updater, replacement, rollback, and installer updates
      run: python -m pytest tests/test_update_helpers.py tests/test_updater.py -q

    - name: Download Vendor Binaries
      run: |
        python -m backend.infrastructure.downloader
        Copy-Item -Path "$env:LOCALAPPDATA\Pirate Cinema\vendor" -Destination "vendor" -Recurse

    - name: Build Portable (Windows)
      run: |
        pyinstaller --name pirate-cinema-portable --onefile --windowed --icon build/icon.ico --add-data "static;static" --add-data "vendor;vendor" --add-data "version.json;." --add-data "backend/infrastructure/mpv/cinema.lua;backend/infrastructure/mpv" --add-data "backend/services/remote_assets;backend/services/remote_assets" run.py

    - name: Build Installer Dir (Windows)
      run: |
        pyinstaller --name pirate-cinema --onedir --windowed --icon build/icon.ico --add-data "static;static" --add-data "vendor;vendor" --add-data "version.json;." --add-data "backend/infrastructure/mpv/cinema.lua;backend/infrastructure/mpv" --add-data "backend/services/remote_assets;backend/services/remote_assets" run.py

    - name: Check Windows bundles start and generate QR codes
      timeout-minutes: 2
      env:
        PYSTRAY_BACKEND: dummy
      run: |
        foreach ($exe in @("dist/pirate-cinema-portable.exe", "dist/pirate-cinema/pirate-cinema.exe")) {
          $process = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList "--smoke-test" -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Bundle smoke test failed: $exe ($($process.ExitCode))" }
        }

    - name: Compile NSIS Installer
      run: |
        $archive = Join-Path $env:RUNNER_TEMP 'nsis-3.13.zip'
        $destination = Join-Path $env:RUNNER_TEMP 'nsis'
        curl.exe --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 60 --output "$archive" "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip"
        if ($LASTEXITCODE -ne 0) { throw "NSIS download failed ($LASTEXITCODE)" }
        if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne 'ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8') {
          throw 'NSIS archive SHA-256 mismatch'
        }
        Expand-Archive -LiteralPath $archive -DestinationPath $destination
        & (Join-Path $destination 'nsis-3.13\makensis.exe') build/installer.nsi
        if ($LASTEXITCODE -ne 0) { throw "NSIS compilation failed ($LASTEXITCODE)" }

    - name: Upload Windows Portable
      if: needs.quality-gate-backend.outputs.licenses_complete == 'true' && vars.PIRATE_CINEMA_CODEC_REDISTRIBUTION_APPROVED == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: pirate-cinema-portable.exe
        path: dist/pirate-cinema-portable.exe

    - name: Upload Windows Installer
      if: needs.quality-gate-backend.outputs.licenses_complete == 'true' && vars.PIRATE_CINEMA_CODEC_REDISTRIBUTION_APPROVED == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: pirate-cinema-installer.exe
        path: pirate-cinema-installer.exe

  build-linux:
    name: Build on Linux
    needs: [quality-gate-backend, quality-gate-frontend]
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      PYTHONHASHSEED: '0'
      QT_API: pyqt6
    steps:
    - uses: actions/checkout@v4

    - name: Set packaging timestamp
      run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

    - name: Install dependencies
      run: |
        for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/*.list \
          /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors.txt; do
          if [[ -f "$source_file" ]]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' "$source_file"
          fi
        done
        timeout 5m sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
        sudo apt-get install -y --no-install-recommends mpv patchelf libfuse2t64 desktop-file-utils file binutils xvfb xauth x11-utils xdotool libegl1 libgl1 libgl1-mesa-dri libasound2t64 ffmpeg libnss3 libxdamage1 libgbm1 libxkbfile1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1
        sudo apt-get install -y --no-install-recommends python3-venv python3-pyqt6 \
          python3-pyqt6.qtwebchannel python3-pyqt6.qtwebengine qt6-webengine-private-dev \
          dbus-daemon pulseaudio pulseaudio-utils
        /usr/bin/python3 -m venv --system-site-packages .venv
        .venv/bin/python -m pip install -r requirements-linux-build.txt
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

    - name: Key the Linux media bundle cache to the installed ABI and bundler inputs
      id: media-cache-key
      run: |
        digest=$(
          {
            printf 'schema=linux-media-bundle-v1\narch=%s\n' "$(uname -m)"
            dpkg-query -W -f='${binary:Package}=${Version}\n' | LC_ALL=C sort
            sha256sum scripts/bundle_linux_mpv.py scripts/bundle_linux_ffmpeg.py requirements-linux-build.txt
          } | sha256sum | cut -d' ' -f1
        )
        echo "key=linux-media-${RUNNER_OS}-${RUNNER_ARCH}-${digest}" >> "$GITHUB_OUTPUT"

    - name: Cache bundled Linux FFmpeg and MPV dependencies
      id: media-bundle-cache
      uses: actions/cache@v4
      with:
        path: build/linux-media-cache
        key: ${{ steps.media-cache-key.outputs.key }}

    - name: Test Linux startup and process management
      run: |
        python -m pytest tests/test_torrserver_process.py tests/test_instance_lock.py tests/test_linux_startup.py tests/test_update_helpers.py tests/test_updater.py tests/test_appimage_packaging.py tests/test_linux_bundle_size.py tests/test_optimize_linux_payload.py tests/test_mobile.py tests/test_mobile_hls.py tests/test_mobile_pairing.py tests/test_ffmpeg_tools.py tests/test_asyncio_errors.py tests/test_cinema_osd.py tests/test_cinema_interaction.py tests/test_mpv_controller.py tests/test_player_preview.py tests/test_service_recovery.py tests/test_smart_continuation.py -q

    - name: Download Vendor Binaries
      run: |
        export XDG_DATA_HOME="$RUNNER_TEMP/pirate-cinema-vendor"
        python -c 'from backend.infrastructure.downloader import ensure_torrserver_binary; ensure_torrserver_binary()'
        install -Dm755 "$XDG_DATA_HOME/Pirate Cinema/vendor/torrserver/torrserver" vendor/torrserver/torrserver
        if [[ "${{ steps.media-bundle-cache.outputs.cache-hit }}" == "true" && \
              -x build/linux-media-cache/mpv/mpv && \
              -x build/linux-media-cache/mpv/mpv.bin && \
              -x build/linux-media-cache/ffmpeg/ffmpeg && \
              -x build/linux-media-cache/ffmpeg/ffmpeg.bin && \
              -x build/linux-media-cache/ffmpeg/ffprobe && \
              -x build/linux-media-cache/ffmpeg/ffprobe.bin ]]; then
          echo "Reusing exact-version Linux media bundle cache"
          mkdir -p vendor
          cp -a build/linux-media-cache/mpv vendor/mpv
          cp -a build/linux-media-cache/ffmpeg vendor/ffmpeg
        else
          echo "Building Linux media bundle from the installed Ubuntu packages"
          python -m scripts.bundle_linux_mpv --output ./vendor/mpv
          python -m scripts.bundle_linux_ffmpeg --output ./vendor/ffmpeg
          mkdir -p build/linux-media-cache
          cp -a vendor/mpv build/linux-media-cache/mpv
          cp -a vendor/ffmpeg build/linux-media-cache/ffmpeg
        fi
        ./vendor/mpv/mpv --version
        ./vendor/ffmpeg/ffmpeg -version
        ./vendor/ffmpeg/ffprobe -version

    - name: Check H.264/AAC and VP9/Opus through run.sh in the main window
      timeout-minutes: 3
      env:
        PIRATE_CINEMA_QT_RUNTIME: system
      run: |
        export XDG_DATA_HOME="$(mktemp -d)"
        trap 'rm -rf -- "$XDG_DATA_HOME"' EXIT
        mkdir -p "$XDG_DATA_HOME/Pirate Cinema/vendor"
        cp -a vendor/torrserver "$XDG_DATA_HOME/Pirate Cinema/vendor/"
        xvfb-run -a dbus-run-session -- scripts/ci_webengine_smoke.sh ./run.sh
        xvfb-run -a -s '-screen 0 1600x1000x24 +extension GLX' \
          python -m pytest tests/test_embedded_mpv_regression.py::test_real_embedded_x11_mpv_flow -q

    - name: Build Onedir (Linux)
      run: |
        time python -m PyInstaller --noconfirm --clean scripts/pirate-cinema-linux.spec
        python -m scripts.stage_linux_vendor
        python -m scripts.optimize_linux_payload

    - name: Build Tar (Linux)
      working-directory: dist
      run: |
        archive() {
          local output="$1"
          shift
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner -cf - "$@" |
            gzip -n -6 > "$output"
        }
        archive pirate-cinema-linux.tar.gz pirate-cinema-linux
        archive pirate-cinema-linux-media-x86_64.tar.gz \
          pirate-cinema-linux/_internal/vendor/mpv \
          pirate-cinema-linux/_internal/vendor/ffmpeg

    - name: Key the AppImage runtime cache to pinned source, patch, and Docker
      id: runtime-cache-key
      run: |
        runtime_commit=$(python -c 'from scripts.build_runtime import TYPE2_RUNTIME_COMMIT; print(TYPE2_RUNTIME_COMMIT)')
        docker_version=$(docker version --format '{{.Server.Version}}')
        inputs_sha=$(sha256sum scripts/build_runtime.py scripts/patch_runtime.py patches/runtime-fuse-fallback.patch | sha256sum | cut -d' ' -f1)
        echo "key=type2-runtime-${RUNNER_OS}-${RUNNER_ARCH}-${runtime_commit}-${docker_version}-${inputs_sha}" >> "$GITHUB_OUTPUT"

    - name: Cache AppImage type 2 runtime
      id: runtime-cache
      uses: actions/cache@v4
      with:
        path: build/runtime-cache
        key: ${{ steps.runtime-cache-key.outputs.key }}

    - name: Verify or build AppImage runtime with FUSE fallback
      run: |
        mkdir -p build/runtime
        if python - <<'PY'
        import hashlib
        import shutil
        import sys
        from pathlib import Path
        from scripts.build_runtime import verify_runtime_magic

        cache = Path("build/runtime-cache")
        runtime = cache / "runtime-x86_64"
        checksum = cache / "runtime-x86_64.sha256"
        output = Path("build/runtime/runtime-x86_64")
        if runtime.is_file() and checksum.is_file() and verify_runtime_magic(runtime):
            actual = hashlib.sha256(runtime.read_bytes()).hexdigest()
            expected = checksum.read_text(encoding="ascii").strip()
            if actual == expected:
                shutil.copy2(runtime, output)
                output.chmod(output.stat().st_mode | 0o111)
                print(f"Verified cached AppImage runtime SHA-256: {actual}")
                sys.exit(0)
        print("Runtime cache miss or invalid checksum; rebuild is required")
        sys.exit(1)
        PY
        then
          echo "Using verified cached AppImage runtime"
        else
          python -m scripts.build_runtime --output build/runtime/runtime-x86_64
          python - <<'PY'
        import hashlib
        import shutil
        from pathlib import Path
        from scripts.build_runtime import verify_runtime_magic

        output = Path("build/runtime/runtime-x86_64")
        if not verify_runtime_magic(output):
            raise SystemExit("Built AppImage runtime lacks ELF/AppImage type 2 magic")
        cache = Path("build/runtime-cache")
        cache.mkdir(parents=True, exist_ok=True)
        shutil.copy2(output, cache / output.name)
        digest = hashlib.sha256(output.read_bytes()).hexdigest()
        (cache / f"{output.name}.sha256").write_text(digest + "\n", encoding="ascii")
        print(f"Verified AppImage runtime SHA-256: {digest}")
        PY
        fi

    - name: Cache verified AppImage tooling
      uses: actions/cache@v4
      with:
        path: build/tools/appimagetool-x86_64.AppImage
        key: appimagetool-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_appimage.py') }}

    - name: Build AppImage (Linux)
      run: |
        time python -m scripts.build_appimage --runtime-file build/runtime/runtime-x86_64

    - name: Audit AppImage glibc compatibility
      run: |
        audit_dir=$(mktemp -d "$RUNNER_TEMP/appimage-abi.XXXXXX")
        trap 'rm -rf -- "$audit_dir"' EXIT
        (cd "$audit_dir" && "$GITHUB_WORKSPACE/dist/Pirate_Cinema-x86_64.AppImage" --appimage-extract >/dev/null)
        report=$(python -m scripts.audit_linux_abi \
          "$audit_dir/squashfs-root" "$GITHUB_WORKSPACE/dist/Pirate_Cinema-x86_64.AppImage")
        printf '%s\n' "$report" | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Analyze Linux package sizes and duplicates
      run: |
        mkdir -p dist/size-reports
        python -m scripts.analyze_linux_bundle dist/pirate-cinema-linux \
          --appimage dist/Pirate_Cinema-x86_64.AppImage --tar dist/pirate-cinema-linux.tar.gz \
          --baseline scripts/linux-size-baseline-v0.4.6.json --json dist/size-reports/onedir.json
        python -m scripts.analyze_linux_bundle build/AppDir --json dist/size-reports/AppDir.json
        python -m pip freeze > dist/size-reports/python-dependencies.txt
        dpkg-query -W > dist/size-reports/host-packages.txt

    - name: Upload Linux size reports
      uses: actions/upload-artifact@v4
      with:
        name: linux-size-reports
        path: dist/size-reports/

    - name: Uninstall host media tools and Qt WebEngine
      run: |
        sudo apt-get purge -y mpv ffmpeg python3-pyqt6.qtwebengine libqt6webenginecore6
        if ldconfig -p | grep -q libQt6WebEngineCore; then
          echo "Host Qt WebEngine is still installed"
          exit 1
        fi
        for tool in mpv ffmpeg ffprobe; do
          if command -v "$tool"; then
            echo "Error: system $tool still found on PATH"
            exit 1
          fi
        done

    - name: Test packaged media tools on local video
      timeout-minutes: 4
      run: |
        scratch=$(mktemp -d "$RUNNER_TEMP/pirate smoke.XXXXXX")
        trap 'rm -rf -- "$scratch"' EXIT
        tar -xzf dist/pirate-cinema-linux.tar.gz -C "$scratch"
        image="$PWD/dist/Pirate_Cinema-x86_64.AppImage"
        smoke="$PWD/tests/smoke_linux_media.py"
        cd "$scratch"
        "$image" --appimage-extract > /dev/null
        python "$smoke" "$scratch/squashfs-root/_internal/vendor"
        python "$smoke" "$scratch/pirate-cinema-linux/_internal/vendor"
        "$scratch/squashfs-root/AppRun" --smoke-test-mpv

    - name: Check AppImage with FUSE (Standard Mount)
      timeout-minutes: 3
      env:
        PIRATE_CINEMA_MIN_CHROMIUM_SECURITY_VERSION: '155.0.8059.85'
      run: |
        ./dist/Pirate_Cinema-x86_64.AppImage --smoke-test
        ./dist/Pirate_Cinema-x86_64.AppImage --smoke-test-mpv
        xvfb-run -a dbus-run-session -- scripts/ci_webengine_smoke.sh ./dist/Pirate_Cinema-x86_64.AppImage
        xvfb-run python tests/smoke_embedded_mpv.py ./dist/Pirate_Cinema-x86_64.AppImage

    - name: Check AppImage without FUSE (Automatic Fallback)
      timeout-minutes: 3
      env:
        PIRATE_CINEMA_MIN_CHROMIUM_SECURITY_VERSION: '155.0.8059.85'
      run: |
        if [[ -e /dev/fuse ]]; then
          fuse_mode=$(stat -c %a /dev/fuse)
          trap 'sudo chmod "$fuse_mode" /dev/fuse' EXIT
          sudo chmod 000 /dev/fuse
        fi
        ./dist/Pirate_Cinema-x86_64.AppImage --smoke-test
        ./dist/Pirate_Cinema-x86_64.AppImage --smoke-test-mpv
        xvfb-run -a dbus-run-session -- scripts/ci_webengine_smoke.sh ./dist/Pirate_Cinema-x86_64.AppImage
        xvfb-run python tests/smoke_no_fuse.py ./dist/Pirate_Cinema-x86_64.AppImage

    - name: Check Linux bundles serve UI and AppImage opens a desktop window
      timeout-minutes: 3
      env:
        PIRATE_CINEMA_MIN_CHROMIUM_SECURITY_VERSION: '155.0.8059.85'
      run: |
        tar_smoke_dir=$(mktemp -d)
        trap 'rm -rf -- "$tar_smoke_dir"' EXIT
        tar -xzf ./dist/pirate-cinema-linux.tar.gz -C "$tar_smoke_dir"
        xvfb-run -a dbus-run-session -- scripts/ci_webengine_smoke.sh "$tar_smoke_dir/pirate-cinema-linux/pirate-cinema-linux"
        xvfb-run python tests/smoke_linux_bundle.py "$tar_smoke_dir/pirate-cinema-linux/pirate-cinema-linux" --native
        xvfb-run python tests/smoke_linux_bundle.py ./dist/Pirate_Cinema-x86_64.AppImage
        xvfb-run python tests/smoke_linux_bundle.py ./dist/Pirate_Cinema-x86_64.AppImage --native

    - name: Upload Linux AppImage
      if: needs.quality-gate-backend.outputs.licenses_complete == 'true' && vars.PIRATE_CINEMA_CODEC_REDISTRIBUTION_APPROVED == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Pirate_Cinema-x86_64.AppImage
        path: dist/Pirate_Cinema-x86_64.AppImage

    - name: Upload Linux Tar
      if: needs.quality-gate-backend.outputs.licenses_complete == 'true' && vars.PIRATE_CINEMA_CODEC_REDISTRIBUTION_APPROVED == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: pirate-cinema-linux.tar.gz
        path: dist/pirate-cinema-linux.tar.gz

    - name: Upload Linux Media Tools
      if: needs.quality-gate-backend.outputs.licenses_complete == 'true' && vars.PIRATE_CINEMA_CODEC_REDISTRIBUTION_APPROVED == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: pirate-cinema-linux-media-x86_64.tar.gz
        path: dist/pirate-cinema-linux-media-x86_64.tar.gz

  build-flatpak:
    name: Build Flatpak (Linux x86_64)
    needs: [quality-gate-backend, quality-gate-frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APP_ID: io.github.sadctnbeh.PirateCinema
      FLATPAK_BRANCH: '6.11'
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: scripts/flatpak/requirements-flatpak.txt

    - name: Install Flatpak and smoke test tools
      run: |
        for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/*.list \
          /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors.txt; do
          if [[ -f "$source_file" ]]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' "$source_file"
          fi
        done
        timeout 5m sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
        sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils \
          appstream desktop-file-utils dbus-daemon fuse3 xdg-desktop-portal xdg-desktop-portal-gtk \
          xvfb xauth x11-utils libgl1-mesa-dri pulseaudio pulseaudio-utils ccache

    - name: Cache downloaded Flatpak sources
      uses: actions/cache@v4
      with:
        path: |
          .flatpak-builder/downloads
          .flatpak-builder/git
        key: flatpak-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/flatpak/io.github.sadctnbeh.PirateCinema.yml', 'scripts/flatpak/mpv-install-rpath.patch') }}

    - name: Prepare the pinned Python wheelhouse
      run: |
        export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
        python -m pip install pip==26.0.1 setuptools==84.2.1 wheel==0.46.3
        python -m pip wheel --require-hashes --no-build-isolation --prefer-binary \
          --wheel-dir scripts/flatpak/wheels -r scripts/flatpak/requirements-flatpak.txt

    - name: Validate manifest and install the SDK
      run: |
        flatpak-builder --show-manifest "scripts/flatpak/$APP_ID.yml" > /dev/null
        desktop-file-validate "scripts/flatpak/$APP_ID.desktop"
        appstreamcli validate --no-net "scripts/flatpak/$APP_ID.metainfo.xml"
        flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        # Refresh branch metadata so the clean runner resolves the latest 6.11 WebEngine BaseApp.
        timeout 3m flatpak update --user --noninteractive --appstream
        flatpak install --user --arch=x86_64 --noninteractive flathub \
          "org.kde.Platform//$FLATPAK_BRANCH" "org.kde.Sdk//$FLATPAK_BRANCH" \
          "com.riverbankcomputing.PyQt.BaseApp//$FLATPAK_BRANCH"
        for ref in org.kde.Sdk org.kde.Platform com.riverbankcomputing.PyQt.BaseApp; do
          printf '%s: ' "$ref"
          flatpak info --user --show-commit "$ref//$FLATPAK_BRANCH"
        done

    - name: Key Flatpak compiler cache to media toolchain
      id: flatpak-ccache-key
      run: |
        digest=$(
          {
            printf 'schema=flatpak-media-ccache-v1\narch=%s\nbranch=%s\n' "$(uname -m)" "$FLATPAK_BRANCH"
            for ref in org.kde.Sdk org.kde.Platform com.riverbankcomputing.PyQt.BaseApp; do
              printf '%s=' "$ref"
              flatpak info --user --show-commit "$ref//$FLATPAK_BRANCH"
            done
            flatpak-builder --version
            ccache --version | head -n 1
            awk '/^  - name: pirate-cinema$/ { exit } { print }' "scripts/flatpak/$APP_ID.yml" | sha256sum
            sha256sum scripts/flatpak/mpv-install-rpath.patch
          } | sha256sum | cut -d' ' -f1
        )
        echo "key=flatpak-ccache-${RUNNER_OS}-${RUNNER_ARCH}-${digest}" >> "$GITHUB_OUTPUT"

    - name: Cache Flatpak media compiler objects
      id: flatpak-ccache
      uses: actions/cache/restore@v4
      with:
        path: build/flatpak-ccache
        key: ${{ steps.flatpak-ccache-key.outputs.key }}

    - name: Limit Flatpak compiler cache size
      env:
        CCACHE_DIR: ${{ github.workspace }}/build/flatpak-ccache
      run: |
        mkdir -p "$CCACHE_DIR"
        ccache --max-size=5G
        ccache --show-stats

    - name: Build and export the Flatpak
      env:
        CCACHE_DIR: ${{ github.workspace }}/build/flatpak-ccache
      run: |
        build_start=$SECONDS
        time flatpak-builder --user --arch=x86_64 --jobs="$(nproc)" --ccache --force-clean --disable-rofiles-fuse --disable-updates \
          --override-source-date-epoch="$(git log -1 --format=%ct)" \
          --default-branch=stable --repo=build/flatpak-repo \
          build/flatpak-app "scripts/flatpak/$APP_ID.yml"
        echo "Flatpak module build elapsed: $((SECONDS - build_start)) seconds" | tee -a "$GITHUB_STEP_SUMMARY"
        ccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"
        mkdir -p dist
        bundle_start=$SECONDS
        flatpak build-bundle --arch=x86_64 \
          --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
          build/flatpak-repo dist/Pirate_Cinema-x86_64.flatpak "$APP_ID" stable
        echo "Flatpak bundle export elapsed: $((SECONDS - bundle_start)) seconds" | tee -a "$GITHUB_STEP_SUMMARY"
        size=$(stat -c %s dist/Pirate_Cinema-x86_64.flatpak)
        echo "Pirate_Cinema-x86_64.flatpak: $size bytes" | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Save Flatpak media compiler cache
      if: steps.flatpak-ccache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: build/flatpak-ccache
        key: ${{ steps.flatpak-ccache-key.outputs.key }}

    - name: Install and smoke test the exported Flatpak
      timeout-minutes: 6
      env:
        PIRATE_CINEMA_MIN_CHROMIUM_SECURITY_VERSION: '155.0.8059.85'
      run: |
        flatpak install --user --noninteractive --bundle dist/Pirate_Cinema-x86_64.flatpak
        # The document portal forwards paths under the sandbox's canonical runtime directory.
        export XDG_RUNTIME_DIR="/run/user/$(id -u)"
        if [[ ! -d "$XDG_RUNTIME_DIR" ]]; then
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$XDG_RUNTIME_DIR"
        fi
        xvfb-run -a -s '-screen 0 1600x1000x24 +extension GLX' dbus-run-session -- \
          bash -eu -c '
            pulseaudio --start --exit-idle-time=-1 --load="module-null-sink sink_name=pirate_ci"
            trap "pulseaudio --kill" EXIT
            pactl set-default-sink pirate_ci
            flatpak run "$APP_ID" --smoke-test
            flatpak run "$APP_ID" --smoke-test-mpv
            flatpak run "$APP_ID" --smoke-test-webengine
            flatpak run "$APP_ID" --flatpak-diagnostics --require-audio
            python tests/smoke_flatpak.py "$APP_ID"
          '

    - name: Upload Linux Flatpak
      if: needs.quality-gate-backend.outputs.licenses_complete == 'true' && vars.PIRATE_CINEMA_CODEC_REDISTRIBUTION_APPROVED == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Pirate_Cinema-x86_64.flatpak
        path: dist/Pirate_Cinema-x86_64.flatpak
        if-no-files-found: error
        compression-level: 0

  release:
    needs: [quality-gate-backend, quality-gate-frontend, build-windows, build-linux, build-flatpak]
    runs-on: ubuntu-latest
    # Branch runs build and test. Only a v* tag with redistribution approval can publish.
    if: startsWith(github.ref, 'refs/tags/v') && needs.quality-gate-backend.outputs.licenses_complete == 'true' && vars.PIRATE_CINEMA_CODEC_REDISTRIBUTION_APPROVED == 'true'
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: release_assets/
        merge-multiple: true
        pattern: '!linux-size-reports'

    - name: Generate Checksums
      run: |
        cd release_assets
        sha256sum \
          pirate-cinema-portable.exe \
          pirate-cinema-installer.exe \
          Pirate_Cinema-x86_64.AppImage \
          pirate-cinema-linux.tar.gz \
          pirate-cinema-linux-media-x86_64.tar.gz \
          Pirate_Cinema-x86_64.flatpak > SHA256SUMS
        echo "CHECKSUMS<<EOF" >> $GITHUB_ENV
        cat SHA256SUMS >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        fail_on_unmatched_files: true
        files: |
          release_assets/pirate-cinema-portable.exe
          release_assets/pirate-cinema-installer.exe
          release_assets/Pirate_Cinema-x86_64.AppImage
          release_assets/pirate-cinema-linux.tar.gz
          release_assets/pirate-cinema-linux-media-x86_64.tar.gz
          release_assets/Pirate_Cinema-x86_64.flatpak
          release_assets/SHA256SUMS
        generate_release_notes: true
        body: |
          ### Checksums (SHA-256)
          ```
          ${{ env.CHECKSUMS }}
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
