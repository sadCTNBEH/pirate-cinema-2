name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality-gate-backend:
    name: Quality Gate Backend (Lint, Types, Tests)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies and quality tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Ruff Lint Check
      run: |
        python -m ruff check .

    - name: Mypy Strict Typing Check
      run: |
        python -m mypy backend/models backend/core backend/exceptions backend/repositories

    - name: Run Backend Pytest Suite
      run: |
        python -m pytest tests/ -q

  quality-gate-frontend:
    name: Quality Gate Frontend (Lint, Types, Tests, Build)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install frontend dependencies
      working-directory: frontend
      run: |
        npm ci

    - name: Check TypeScript Types (tsc --noEmit)
      working-directory: frontend
      run: |
        npm run lint:types

    - name: Run ESLint
      working-directory: frontend
      run: |
        npm run lint:eslint

    - name: Run Node Tests
      working-directory: frontend
      run: |
        npm test

    - name: Build Frontend
      working-directory: frontend
      run: |
        npm run build

  test-updater:
    name: Test updater (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Test platform update and rollback helpers
      run: |
        python -m pip install pytest==9.1.1
        python -m pytest tests/test_update_helpers.py -q

  build-windows:
    name: Build on Windows
    needs: [quality-gate-backend, quality-gate-frontend, test-updater]
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller==6.19.0

    - name: Download Vendor Binaries
      run: |
        python -m backend.infrastructure.downloader
        Copy-Item -Path "$env:LOCALAPPDATA\Pirate Cinema\vendor" -Destination "vendor" -Recurse

    - name: Build Portable (Windows)
      run: |
        pyinstaller --name pirate-cinema-portable --onefile --windowed --icon build/icon.ico --add-data "static;static" --add-data "vendor;vendor" --add-data "version.json;." --add-data "backend/infrastructure/mpv/cinema.lua;backend/infrastructure/mpv" --add-data "backend/services/remote_assets;backend/services/remote_assets" run.py

    - name: Build Installer Dir (Windows)
      run: |
        pyinstaller --name pirate-cinema --onedir --windowed --icon build/icon.ico --add-data "static;static" --add-data "vendor;vendor" --add-data "version.json;." --add-data "backend/infrastructure/mpv/cinema.lua;backend/infrastructure/mpv" --add-data "backend/services/remote_assets;backend/services/remote_assets" run.py

    - name: Check Windows bundles start and generate QR codes
      timeout-minutes: 2
      env:
        PYSTRAY_BACKEND: dummy
      run: |
        foreach ($exe in @("dist/pirate-cinema-portable.exe", "dist/pirate-cinema/pirate-cinema.exe")) {
          $process = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList "--smoke-test" -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Bundle smoke test failed: $exe ($($process.ExitCode))" }
        }

    - name: Compile NSIS Installer
      run: |
        choco install nsis
        & 'C:\Program Files (x86)\NSIS\makensis.exe' build/installer.nsi

    - name: Upload Windows Portable
      uses: actions/upload-artifact@v4
      with:
        name: pirate-cinema-portable.exe
        path: dist/pirate-cinema-portable.exe

    - name: Upload Windows Installer
      uses: actions/upload-artifact@v4
      with:
        name: pirate-cinema-installer.exe
        path: pirate-cinema-installer.exe

  build-linux:
    name: Build on Linux
    needs: [quality-gate-backend, quality-gate-frontend, test-updater]
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    env:
      PYTHONHASHSEED: '0'
      QT_API: pyqt6
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set packaging timestamp
      run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends mpv patchelf libfuse2 desktop-file-utils file binutils xvfb xauth x11-utils libegl1 libgl1 libgl1-mesa-dri libasound2 ffmpeg libnss3 libxdamage1 libgbm1 libxkbfile1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1
        python -m pip install -r requirements-linux-build.txt

    - name: Test Linux startup and process management
      run: |
        python -m pytest tests/test_torrserver_process.py tests/test_instance_lock.py tests/test_linux_startup.py tests/test_update_helpers.py tests/test_updater.py tests/test_appimage_packaging.py tests/test_linux_bundle_size.py tests/test_optimize_linux_payload.py tests/test_mobile.py tests/test_mobile_hls.py tests/test_mobile_pairing.py tests/test_ffmpeg_tools.py tests/test_asyncio_errors.py tests/test_cinema_osd.py tests/test_cinema_interaction.py tests/test_mpv_controller.py tests/test_player_preview.py tests/test_service_recovery.py tests/test_smart_continuation.py -q

    - name: Download Vendor Binaries
      run: |
        export XDG_DATA_HOME="$RUNNER_TEMP/pirate-cinema-vendor"
        python -c 'from backend.infrastructure.downloader import ensure_torrserver_binary; ensure_torrserver_binary()'
        install -Dm755 "$XDG_DATA_HOME/Pirate Cinema/vendor/torrserver/torrserver" vendor/torrserver/torrserver
        python -m scripts.bundle_linux_mpv --output ./vendor/mpv
        python -m scripts.bundle_linux_ffmpeg --output ./vendor/ffmpeg
        ./vendor/mpv/mpv --version
        ./vendor/ffmpeg/ffmpeg -version
        ./vendor/ffmpeg/ffprobe -version

    - name: Build Onedir (Linux)
      run: |
        python -m PyInstaller --noconfirm --clean scripts/pirate-cinema-linux.spec
        python -m scripts.stage_linux_vendor
        python -m scripts.optimize_linux_payload

    - name: Build Tar (Linux)
      working-directory: dist
      run: |
        archive() {
          local output="$1"
          shift
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner -cf - "$@" |
            gzip -n -6 > "$output"
        }
        archive pirate-cinema-linux.tar.gz pirate-cinema-linux
        archive pirate-cinema-linux-media-x86_64.tar.gz \
          pirate-cinema-linux/_internal/vendor/mpv \
          pirate-cinema-linux/_internal/vendor/ffmpeg

    - name: Build Custom AppImage Runtime with FUSE Fallback
      run: |
        python -m scripts.build_runtime --output build/runtime/runtime-x86_64

    - name: Build AppImage (Linux)
      run: |
        python -m scripts.build_appimage --runtime-file build/runtime/runtime-x86_64

    - name: Analyze Linux package sizes and duplicates
      run: |
        mkdir -p dist/size-reports
        python -m scripts.analyze_linux_bundle dist/pirate-cinema-linux \
          --appimage dist/Pirate_Cinema-x86_64.AppImage --tar dist/pirate-cinema-linux.tar.gz \
          --baseline scripts/linux-size-baseline-v0.4.6.json --json dist/size-reports/onedir.json
        python -m scripts.analyze_linux_bundle build/AppDir --json dist/size-reports/AppDir.json
        python -m pip freeze > dist/size-reports/python-dependencies.txt
        dpkg-query -W > dist/size-reports/host-packages.txt

    - name: Upload Linux size reports
      uses: actions/upload-artifact@v4
      with:
        name: linux-size-reports
        path: dist/size-reports/

    - name: Uninstall host media tools
      run: |
        sudo apt-get purge -y mpv ffmpeg
        for tool in mpv ffmpeg ffprobe; do
          if command -v "$tool"; then
            echo "Error: system $tool still found on PATH"
            exit 1
          fi
        done

    - name: Test packaged media tools on local video
      timeout-minutes: 4
      run: |
        scratch=$(mktemp -d "$RUNNER_TEMP/pirate smoke.XXXXXX")
        trap 'rm -rf -- "$scratch"' EXIT
        tar -xzf dist/pirate-cinema-linux.tar.gz -C "$scratch"
        image="$PWD/dist/Pirate_Cinema-x86_64.AppImage"
        smoke="$PWD/tests/smoke_linux_media.py"
        cd "$scratch"
        "$image" --appimage-extract > /dev/null
        python "$smoke" "$scratch/squashfs-root/_internal/vendor"
        python "$smoke" "$scratch/pirate-cinema-linux/_internal/vendor"
        "$scratch/squashfs-root/AppRun" --smoke-test-mpv

    - name: Check AppImage with FUSE (Standard Mount)
      timeout-minutes: 3
      run: |
        ./dist/Pirate_Cinema-x86_64.AppImage --smoke-test
        ./dist/Pirate_Cinema-x86_64.AppImage --smoke-test-mpv
        xvfb-run python tests/smoke_embedded_mpv.py ./dist/Pirate_Cinema-x86_64.AppImage

    - name: Check AppImage without FUSE (Automatic Fallback)
      timeout-minutes: 3
      run: |
        fuse_mode=$(stat -c %a /dev/fuse)
        trap 'sudo chmod "$fuse_mode" /dev/fuse' EXIT
        sudo chmod 000 /dev/fuse
        ./dist/Pirate_Cinema-x86_64.AppImage --smoke-test
        ./dist/Pirate_Cinema-x86_64.AppImage --smoke-test-mpv
        xvfb-run python tests/smoke_no_fuse.py ./dist/Pirate_Cinema-x86_64.AppImage

    - name: Check Linux bundles serve UI and AppImage opens a desktop window
      timeout-minutes: 3
      run: |
        tar_smoke_dir=$(mktemp -d)
        trap 'rm -rf -- "$tar_smoke_dir"' EXIT
        tar -xzf ./dist/pirate-cinema-linux.tar.gz -C "$tar_smoke_dir"
        xvfb-run python tests/smoke_linux_bundle.py "$tar_smoke_dir/pirate-cinema-linux/pirate-cinema-linux" --native
        xvfb-run python tests/smoke_linux_bundle.py ./dist/Pirate_Cinema-x86_64.AppImage
        xvfb-run python tests/smoke_linux_bundle.py ./dist/Pirate_Cinema-x86_64.AppImage --native

    - name: Upload Linux AppImage
      uses: actions/upload-artifact@v4
      with:
        name: Pirate_Cinema-x86_64.AppImage
        path: dist/Pirate_Cinema-x86_64.AppImage

    - name: Upload Linux Tar
      uses: actions/upload-artifact@v4
      with:
        name: pirate-cinema-linux.tar.gz
        path: dist/pirate-cinema-linux.tar.gz

    - name: Upload Linux Media Tools
      uses: actions/upload-artifact@v4
      with:
        name: pirate-cinema-linux-media-x86_64.tar.gz
        path: dist/pirate-cinema-linux-media-x86_64.tar.gz

  build-flatpak:
    name: Build Flatpak (Linux x86_64)
    needs: [quality-gate-backend, quality-gate-frontend, test-updater]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APP_ID: io.github.sadctnbeh.PirateCinema
      FLATPAK_BRANCH: '25.08'
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: scripts/flatpak/requirements-flatpak.txt

    - name: Install Flatpak and smoke test tools
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends flatpak flatpak-builder \
          appstream desktop-file-utils dbus-daemon fuse3 xdg-desktop-portal xdg-desktop-portal-gtk \
          xvfb xauth x11-utils libgl1-mesa-dri pulseaudio pulseaudio-utils

    - name: Cache downloaded Flatpak sources
      uses: actions/cache@v4
      with:
        path: |
          .flatpak-builder/downloads
          .flatpak-builder/git
        key: flatpak-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/flatpak/*.yml') }}

    - name: Prepare the pinned Python wheelhouse
      run: |
        export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
        python -m pip install pip==26.0.1 setuptools==84.2.1 wheel==0.46.3
        python -m pip wheel --require-hashes --no-build-isolation --prefer-binary \
          --wheel-dir scripts/flatpak/wheels -r scripts/flatpak/requirements-flatpak.txt

    - name: Validate manifest and install the SDK
      run: |
        flatpak-builder --show-manifest "scripts/flatpak/$APP_ID.yml" > /dev/null
        desktop-file-validate "scripts/flatpak/$APP_ID.desktop"
        appstreamcli validate --no-net "scripts/flatpak/$APP_ID.metainfo.xml"
        flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        flatpak install --user --arch=x86_64 --noninteractive flathub \
          "org.freedesktop.Platform//$FLATPAK_BRANCH" "org.freedesktop.Sdk//$FLATPAK_BRANCH"
        flatpak info --user --show-commit "org.freedesktop.Sdk//$FLATPAK_BRANCH"
        flatpak info --user --show-commit "org.freedesktop.Platform//$FLATPAK_BRANCH"

    - name: Build and export the Flatpak
      run: |
        flatpak-builder --user --arch=x86_64 --force-clean --disable-rofiles-fuse --disable-updates \
          --override-source-date-epoch="$(git log -1 --format=%ct)" \
          --default-branch=stable --repo=build/flatpak-repo \
          build/flatpak-app "scripts/flatpak/$APP_ID.yml"
        mkdir -p dist
        flatpak build-bundle --arch=x86_64 \
          --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
          build/flatpak-repo dist/Pirate_Cinema-x86_64.flatpak "$APP_ID" stable
        size=$(stat -c %s dist/Pirate_Cinema-x86_64.flatpak)
        echo "Pirate_Cinema-x86_64.flatpak: $size bytes" | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Install and smoke test the exported Flatpak
      timeout-minutes: 6
      run: |
        flatpak install --user --noninteractive --bundle dist/Pirate_Cinema-x86_64.flatpak
        # The document portal forwards paths under the sandbox's canonical runtime directory.
        export XDG_RUNTIME_DIR="/run/user/$(id -u)"
        if [[ ! -d "$XDG_RUNTIME_DIR" ]]; then
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$XDG_RUNTIME_DIR"
        fi
        xvfb-run -a -s '-screen 0 1600x1000x24 +extension GLX' dbus-run-session -- \
          bash -eu -c '
            pulseaudio --start --exit-idle-time=-1 --load="module-null-sink sink_name=pirate_ci"
            trap "pulseaudio --kill" EXIT
            pactl set-default-sink pirate_ci
            flatpak run "$APP_ID" --smoke-test
            flatpak run "$APP_ID" --smoke-test-mpv
            flatpak run "$APP_ID" --flatpak-diagnostics --require-audio
            python tests/smoke_flatpak.py "$APP_ID"
          '

    - name: Upload Linux Flatpak
      uses: actions/upload-artifact@v4
      with:
        name: Pirate_Cinema-x86_64.flatpak
        path: dist/Pirate_Cinema-x86_64.flatpak
        if-no-files-found: error
        compression-level: 0

  release:
    needs: [build-windows, build-linux, build-flatpak]
    runs-on: ubuntu-latest
    # A manual run on a branch builds artifacts; select a v* tag to publish them.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: release_assets/
        merge-multiple: true
        pattern: '!linux-size-reports'

    - name: Generate Checksums
      run: |
        cd release_assets
        sha256sum \
          pirate-cinema-portable.exe \
          pirate-cinema-installer.exe \
          Pirate_Cinema-x86_64.AppImage \
          pirate-cinema-linux.tar.gz \
          pirate-cinema-linux-media-x86_64.tar.gz \
          Pirate_Cinema-x86_64.flatpak > SHA256SUMS
        echo "CHECKSUMS<<EOF" >> $GITHUB_ENV
        cat SHA256SUMS >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        fail_on_unmatched_files: true
        files: |
          release_assets/pirate-cinema-portable.exe
          release_assets/pirate-cinema-installer.exe
          release_assets/Pirate_Cinema-x86_64.AppImage
          release_assets/pirate-cinema-linux.tar.gz
          release_assets/pirate-cinema-linux-media-x86_64.tar.gz
          release_assets/Pirate_Cinema-x86_64.flatpak
          release_assets/SHA256SUMS
        generate_release_notes: true
        body: |
          ### Checksums (SHA-256)
          ```
          ${{ env.CHECKSUMS }}
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
