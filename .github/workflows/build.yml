name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-updater:
    name: Test updater (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Test platform update and rollback helpers
      run: |
        python -m pip install pytest
        python -m pytest tests/test_update_helpers.py -q

  build-windows:
    name: Build on Windows
    needs: test-updater
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Download Vendor Binaries
      run: |
        python -m backend.infrastructure.downloader
        Copy-Item -Path "$env:LOCALAPPDATA\Pirate Cinema\vendor" -Destination "vendor" -Recurse

    - name: Build Portable (Windows)
      run: |
        pyinstaller --name pirate-cinema-portable --onefile --windowed --icon build/icon.ico --add-data "static;static" --add-data "vendor;vendor" --add-data "version.json;." --add-data "backend/infrastructure/mpv/cinema.lua;backend/infrastructure/mpv" run.py

    - name: Build Installer Dir (Windows)
      run: |
        pyinstaller --name pirate-cinema --onedir --windowed --icon build/icon.ico --add-data "static;static" --add-data "vendor;vendor" --add-data "version.json;." --add-data "backend/infrastructure/mpv/cinema.lua;backend/infrastructure/mpv" run.py

    - name: Check Windows bundles start and generate QR codes
      timeout-minutes: 2
      env:
        PYSTRAY_BACKEND: dummy
      run: |
        foreach ($exe in @("dist/pirate-cinema-portable.exe", "dist/pirate-cinema/pirate-cinema.exe")) {
          $process = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList "--smoke-test" -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Bundle smoke test failed: $exe ($($process.ExitCode))" }
        }

    - name: Compile NSIS Installer
      run: |
        choco install nsis
        & 'C:\Program Files (x86)\NSIS\makensis.exe' build/installer.nsi

    - name: Upload Windows Portable
      uses: actions/upload-artifact@v4
      with:
        name: pirate-cinema-portable.exe
        path: dist/pirate-cinema-portable.exe

    - name: Upload Windows Installer
      uses: actions/upload-artifact@v4
      with:
        name: pirate-cinema-installer.exe
        path: pirate-cinema-installer.exe

  build-linux:
    name: Build on Linux
    needs: test-updater
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends mpv patchelf libfuse2 desktop-file-utils file xvfb
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pytest pytest-asyncio

    - name: Test Linux startup and process management
      run: |
        python -m pytest tests/test_torrserver_process.py tests/test_instance_lock.py tests/test_linux_startup.py tests/test_update_helpers.py tests/test_updater.py tests/test_appimage_packaging.py -q

    - name: Download Vendor Binaries
      run: |
        python -m backend.infrastructure.downloader
        cp -r ~/.local/share/Pirate\ Cinema/vendor ./vendor
        chmod +x ./vendor/torrserver/torrserver
        python scripts/bundle_linux_mpv.py --output ./vendor/mpv

    - name: Build Onedir (Linux)
      run: |
        pyinstaller --name pirate-cinema-linux --onedir --add-data "static:static" --add-data "vendor:vendor" --add-data "version.json:." --add-data "backend/infrastructure/mpv/cinema.lua:backend/infrastructure/mpv" run.py

    - name: Build Tar (Linux)
      run: |
        cd dist
        tar -czvf pirate-cinema-linux.tar.gz pirate-cinema-linux
        cd ..

    - name: Build Custom AppImage Runtime with FUSE Fallback
      run: |
        python scripts/build_runtime.py --output build/runtime/runtime-x86_64

    - name: Build AppImage (Linux)
      run: |
        python scripts/build_appimage.py --runtime-file build/runtime/runtime-x86_64

    - name: Uninstall Host System MPV
      run: |
        sudo apt-get remove -y --purge mpv || true
        sudo apt-get autoremove -y || true
        sudo rm -f /usr/bin/mpv /usr/local/bin/mpv
        if command -v mpv >/dev/null 2>&1 || which mpv >/dev/null 2>&1; then
          echo "Error: system mpv still found on PATH"
          exit 1
        fi
        echo "Confirmed: host system MPV completely uninstalled."

    - name: Check AppImage with FUSE (Standard Mount)
      timeout-minutes: 3
      run: |
        ./dist/Pirate_Cinema-x86_64.AppImage --smoke-test
        ./dist/Pirate_Cinema-x86_64.AppImage --smoke-test-mpv
        xvfb-run python tests/smoke_embedded_mpv.py ./dist/Pirate_Cinema-x86_64.AppImage

    - name: Check AppImage without FUSE (Automatic Fallback)
      timeout-minutes: 3
      run: |
        sudo chmod 000 /dev/fuse
        ./dist/Pirate_Cinema-x86_64.AppImage --smoke-test
        ./dist/Pirate_Cinema-x86_64.AppImage --smoke-test-mpv
        xvfb-run python tests/smoke_no_fuse.py ./dist/Pirate_Cinema-x86_64.AppImage
        sudo chmod 666 /dev/fuse

    - name: Check Linux bundles serve UI and open browser mode
      timeout-minutes: 3
      run: |
        xvfb-run python tests/smoke_linux_bundle.py ./dist/pirate-cinema-linux/pirate-cinema-linux
        xvfb-run python tests/smoke_linux_bundle.py ./dist/Pirate_Cinema-x86_64.AppImage

    - name: Upload Linux AppImage
      uses: actions/upload-artifact@v4
      with:
        name: Pirate_Cinema-x86_64.AppImage
        path: dist/Pirate_Cinema-x86_64.AppImage

    - name: Upload Linux Tar
      uses: actions/upload-artifact@v4
      with:
        name: pirate-cinema-linux.tar.gz
        path: dist/pirate-cinema-linux.tar.gz

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: release_assets/
        merge-multiple: true

    - name: Generate Checksums
      run: |
        cd release_assets
        sha256sum * > SHA256SUMS
        echo "CHECKSUMS<<EOF" >> $GITHUB_ENV
        cat SHA256SUMS >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: release_assets/*
        generate_release_notes: true
        body: |
          ### Checksums (SHA-256)
          ```
          ${{ env.CHECKSUMS }}
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
