[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
cache_dir = .cache/pytest
addopts = -ra --durations=10 --durations-min=1.0 --show-capture=all --tb=short

markers =
    unit: Fast isolated unit tests
    integration: Integration tests with external dependencies, databases, or processes
    smoke: End-to-end smoke tests for builds and critical runtime flows

log_level = INFO
log_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s (%(filename)s:%(lineno)s)
log_date_format = %Y-%m-%d %H:%M:%S
